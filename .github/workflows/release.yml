name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm run pack:preview
      - name: Pack publishable workspaces
        run: |
          rm -rf release-tarballs
          mkdir -p release-tarballs
          for workspace in             packages/core             packages/persistence-file             packages/backend-local             packages/backend-slack             packages/backend-discord             packages/backend-telegram             packages/transport-codex-app-server             packages/cli
          do
            echo "Packing $workspace"
            (cd "$workspace" && npm pack --pack-destination ../../release-tarballs)
          done
      - name: Publish packed tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for tarball in release-tarballs/*.tgz
          do
            echo "Publishing $tarball"
            npm publish "$tarball" --access public --provenance
          done
