name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm run pack:preview
      - name: Publish core packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace packages/core --access public --provenance
          npm publish --workspace packages/persistence-file --access public --provenance
          npm publish --workspace packages/backend-local --access public --provenance
          npm publish --workspace packages/backend-slack --access public --provenance
          npm publish --workspace packages/backend-discord --access public --provenance
          npm publish --workspace packages/backend-telegram --access public --provenance
          npm publish --workspace packages/transport-codex-app-server --access public --provenance
          npm publish --workspace packages/cli --access public --provenance
